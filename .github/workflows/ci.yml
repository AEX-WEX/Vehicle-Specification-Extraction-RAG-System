name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # The unit tests need no ML libraries or Ollama: parsing, table extraction, grounding and scoring are pure Python.
      - run: pip install pytest pyyaml requests python-dotenv
      - run: pytest tests/test_table_parser.py tests/test_eval_scoring.py tests/test_hallucination_guards.py -q
